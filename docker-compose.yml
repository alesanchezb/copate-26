services:
  # El Mensajero (Broker)
  broker:
    image: eclipse-mosquitto:latest
    container_name: mosquitto_broker
    ports:
      - "1883:1883" # Puerto estándar de MQTT
      - "9001:9001" # Puerto para websockets (visualización)
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - red_industrial
  
  cerebro:
    build: ./brain          # Docker buscará el Dockerfile en esa carpeta
    container_name: cerebro_ia
    depends_on:
      - broker              # No arranca hasta que el broker esté listo
      - db                  # Tampoco arranca hasta que Postgres esté listo
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      LINE_ID: ${LINE_ID:-linea1}
      LINE_LABEL: ${LINE_LABEL:-Control de linea 1}
      OPERATOR_NAME: ${OPERATOR_NAME:-Operador 01}
      OPERATOR_LINE_LABEL: ${OPERATOR_LINE_LABEL:-Linea de soldadura alfa}
      ONNX_MODEL_DIR: /app/onnx_models
      TELEMETRY_STALE_SECONDS: ${TELEMETRY_STALE_SECONDS:-30}
    volumes:
      - ./onnx_models:/app/onnx_models:ro
    ports:
      - "8000:8000"
    networks:
      - red_industrial

  # El Archivero (Base de Datos)
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_init/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - red_industrial
networks:
  red_industrial:
    driver: bridge

volumes:
  postgres_data:
