<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspección Manual - Pallet ID</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F4F3F0;
            color: #2D2D2D;
        }
        .card-pallet {
            background: #FFFFFF;
            border: 2px solid #E6E4DD;
            border-radius: 20px;
            padding: 50px 60px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .card-pallet h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #2D2D2D;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .card-pallet p {
            color: #767676;
            margin-bottom: 30px;
        }
        .card-pallet input {
            font-size: 1.5rem;
            text-align: center;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #E6E4DD;
            background: #F4F3F0;
            color: #2D2D2D;
            width: 100%;
            margin-bottom: 20px;
        }
        .card-pallet input:focus {
            outline: none;
            border-color: #EA8300;
            box-shadow: 0 0 10px rgba(234,131,0,0.2);
        }
        .card-pallet button {
            font-size: 1.3rem;
            padding: 14px 40px;
            border-radius: 12px;
            border: none;
            background: #EA8300;
            color: #fff;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .card-pallet button:hover {
            background: #C97000;
        }
        .error-msg {
            color: #EA8300;
            font-weight: bold;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="card-pallet">
    <h1>INSPECCIÓN MANUAL</h1>
    <p>Ingrese el Pallet ID para comenzar la inspección</p>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form action="/inspeccion" method="GET">
        <input type="text" name="pallet_id" id="pallet_id" placeholder="Pallet ID" autofocus required autocomplete="off">
        <button type="submit">INICIAR INSPECCIÓN</button>
    </form>
</div>

</body>
</html>
