<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspección - Pallet {{ pallet_id }}</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            overflow: hidden;
            background: #F4F3F0;
            color: #2D2D2D;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Top bar */
        .top-bar {
            height: 7vh;
            background: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 2px solid #E6E4DD;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .top-bar .pallet-info {
            font-size: 1.2rem;
            font-weight: bold;
            color: #2D2D2D;
        }
        .top-bar .pallet-info span {
            color: #EA8300;
        }
        .top-bar .actions a {
            color: #767676;
            text-decoration: none;
            margin-left: 15px;
            font-size: 0.95rem;
        }
        .top-bar .actions a:hover { color: #2D2D2D; }

        /* Workspace para la imagen y botones */
        .workspace {
            height: 93vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #F4F3F0;
            position: relative;
        }

        /* Contenedor que abraza la imagen para posicionamiento absoluto */
        .image-wrapper {
            position: relative;
            max-width: 100%;
            max-height: 100%;
            display: inline-block;
        }

        .image-wrapper img {
            max-height: 85vh;
            max-width: 100%;
            display: block;
            border-radius: 12px;
            border: 2px solid #E6E4DD;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        /* Estilo general de los botones sobre la imagen */
        .station-btn {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid #E6E4DD;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.92);
            padding: 6px 14px;
            min-width: 70px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
            z-index: 10;
        }

        .station-btn:hover {
            background: rgba(255, 255, 255, 1);
            border-color: #EA8300;
            transform: translate(-50%, -50%) scale(1.05);
            box-shadow: 0 4px 14px rgba(234,131,0,0.2);
        }
        .station-btn.has-defect {
            border-color: #EA8300;
            background: rgba(255, 248, 235, 0.97);
        }
        .station-btn.inspected-ok {
            border-color: #2A9D8F;
            background: rgba(235, 248, 246, 0.97);
        }

        .station-btn .station-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: #2D2D2D;
            letter-spacing: 1px;
        }

        /* Badges de estado */
        .station-btn .defect-badge, .station-btn .ok-badge {
            position: absolute;
            top: -12px;
            right: -12px;
            color: #fff;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .station-btn .defect-badge { background: #EA8300; }
        .station-btn .ok-badge { background: #2A9D8F; }

        /* Atajo de teclado en cada botón */
        .key-hint {
            position: absolute;
            bottom: -11px;
            left: 50%;
            transform: translateX(-50%);
            background: #2D2D2D;
            color: #fff;
            font-size: 0.65rem;
            padding: 1px 7px;
            border-radius: 4px;
            font-weight: bold;
            pointer-events: none;
            white-space: nowrap;
        }
        /* Indicadores de teclado en la barra y botones */
        kbd {
            display: inline-block;
            background: #2D2D2D;
            color: #fff;
            border-radius: 4px;
            padding: 1px 6px;
            font-size: 0.75rem;
            font-family: inherit;
            font-weight: bold;
            margin-right: 3px;
            vertical-align: middle;
        }
        .top-bar kbd { opacity: 0.75; }

        /* Modal de confirmación */
        .confirm-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(45,45,45,0.55);
            backdrop-filter: blur(3px);
            z-index: 1100;
            align-items: center;
            justify-content: center;
        }
        .confirm-overlay.active { display: flex; }
        .confirm-box {
            background: #FFFFFF;
            border: 1px solid #E6E4DD;
            border-radius: 16px;
            padding: 30px 40px;
            max-width: 520px;
            width: 90%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.14);
        }
        .confirm-box h3 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2D2D2D;
            margin-bottom: 16px;
            text-align: center;
        }
        .confirm-summary {
            background: #F4F3F0;
            border: 1px solid #E6E4DD;
            border-radius: 10px;
            padding: 14px 18px;
            font-size: 0.95rem;
            color: #2D2D2D;
            margin-bottom: 20px;
            max-height: 220px;
            overflow-y: auto;
        }
        .confirm-summary .item-defect { color: #EA8300; font-weight: 600; }
        .confirm-summary .item-ok    { color: #2A9D8F; font-weight: 600; }
        .confirm-summary .item-warn  { color: #767676; }
        .confirm-actions {
            display: flex;
            gap: 10px;
        }
        .confirm-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-confirm { background: #EA8300; color: #fff; }
        .btn-confirm:hover { background: #C97000; }
        .btn-back   { background: #E6E4DD; color: #767676; }
        .btn-back:hover { background: #d5d3cc; color: #2D2D2D; }

        /* Coordenadas específicas de cada soldadura (en %) basadas en la imagen */
        /* Pieza 1 (Izquierda) */
        #btn1 { top: 33%; left: 10%; }
        #btn2 { top: 72%; left: 10%; }
        
        /* Pieza 2 (Centro-Izquierda) */
        #btn3 { top: 22%; left: 36%; }
        #btn4 { top: 76%; left: 34%; }
        
        /* Pieza 3 (Centro-Derecha) */
        #btn5 { top: 27%; left: 56%; }
        #btn6 { top: 76%; left: 58%; }
        
        /* Pieza 4 (Derecha - tiene forma de L invertida) */
        #btn7 { top: 29%; left: 73%; }
        #btn8 { top: 75%; left: 95%; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(45,45,45,0.5);
            backdrop-filter: blur(3px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }

        .modal-box {
            background: #FFFFFF;
            border: 1px solid #E6E4DD;
            border-radius: 16px;
            padding: 30px 40px;
            max-width: 550px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
        }
        .modal-box h2 {
            text-align: center;
            margin-bottom: 5px;
            font-size: 1.5rem;
            color: #2D2D2D;
            font-weight: 700;
        }
        .modal-box .modal-subtitle {
            text-align: center;
            color: #2D2D2D;
            margin-bottom: 20px;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .defect-list { list-style: none; padding: 0; }
        .defect-list li { margin-bottom: 8px; }
        .defect-list li button {
            width: 100%;
            padding: 13px 20px;
            border: 1.5px solid #E6E4DD;
            border-radius: 10px;
            background: #F4F3F0;
            color: #2D2D2D;
            font-size: 1.05rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.15s;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .defect-list li button kbd {
            background: rgba(0,0,0,0.12);
            color: #2D2D2D;
            min-width: 22px;
            text-align: center;
            flex-shrink: 0;
        }
        .defect-list li button:hover {
            background: #EA8300;
            border-color: #EA8300;
            color: #fff;
        }
        .defect-list li button:hover kbd {
            background: rgba(255,255,255,0.25);
            color: #fff;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .modal-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-ok { background: #2A9D8F; color: #fff; }
        .btn-ok:hover { background: #21867a; }
        .btn-clear { background: #E6E4DD; color: #767676; }
        .btn-clear:hover { background: #d5d3cc; color: #2D2D2D; }
        .btn-cancel { background: #E6E4DD; color: #767676; }
        .btn-cancel:hover { background: #d5d3cc; color: #2D2D2D; }

        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2A9D8F;
            color: #fff;
            padding: 12px 30px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            z-index: 2000;
            display: none;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .toast-msg.error { background: #EA8300; }
        .toast-msg.show {
            display: block;
            animation: fadeInOut 2.5s ease forwards;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            75% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(20px); }
        }

        .finish-btn-container {
            position: fixed;
            bottom: 12px;
            right: 20px;
            z-index: 500;
        }
        .finish-btn-container button {
            background: #EA8300;
            color: #fff;
            padding: 10px 25px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 2px 8px rgba(234,131,0,0.25);
        }
        .finish-btn-container button:hover { background: #C97000; }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="pallet-info">
        Inspeccionando: Pallet <span>{{ pallet_id }}</span>
    </div>
    <div class="actions">
        <a href="/"><kbd>Esc</kbd> Cambiar Pallet</a>
        <a href="/historial"><kbd>H</kbd> Historial</a>
    </div>
</div>

<div class="workspace">
    <div class="image-wrapper">
        <img src="{{ url_for('static', filename='soldaduras.jpg') }}" alt="Plano de Soldaduras">
        
        {% for btn_id, (estacion, schedule) in button_map.items() %}
        <div class="station-btn" id="{{ btn_id }}" onclick="openDefectMenu('{{ btn_id }}', '{{ estacion }}', '{{ schedule }}')">
            <div class="station-name">{{ estacion }}</div>
            </div>
        {% endfor %}
    </div>
</div>

<div class="modal-overlay" id="defectModal">
    <div class="modal-box">
        <h2 id="modalTitle">Seleccionar Defecto</h2>
        <div class="modal-subtitle" id="modalSubtitle">Estación - Schedule</div>
        <ul class="defect-list">
            {% for defecto in defectos %}
            <li>
                <button onclick="selectDefect('{{ defecto }}')"><kbd>{{ loop.index0 }}</kbd>{{ defecto }}</button>
            </li>
            {% endfor %}
        </ul>
        <div class="modal-actions">
            <button class="btn-clear" onclick="clearStation()"><kbd>L</kbd> Limpiar selección</button>
            <button class="btn-cancel" onclick="closeModal()"><kbd>Esc</kbd> Cancelar</button>
        </div>
    </div>
</div>

<!-- Modal de confirmación de finalización -->
<div class="confirm-overlay" id="confirmModal">
    <div class="confirm-box">
        <h3>Confirmar Inspección</h3>
        <div class="confirm-summary" id="confirmSummary"></div>
        <div class="confirm-actions">
            <button class="btn-confirm" onclick="confirmarFinalizar()"><kbd style="background:rgba(255,255,255,0.25);color:#fff;">&#8629;</kbd> Confirmar y Guardar</button>
            <button class="btn-back" onclick="closeConfirmModal()"><kbd>Esc</kbd> Volver</button>
        </div>
    </div>
</div>

<div class="toast-msg" id="toastMsg"></div>

<div class="finish-btn-container">
    <button onclick="finalizar()">FINALIZAR INSPECCIÓN &nbsp;<kbd style="background:rgba(255,255,255,0.25);color:#fff;border-radius:4px;padding:1px 6px;font-size:0.8rem;">&#8629;</kbd></button>
</div>

<script>
    const palletId = "{{ pallet_id }}";
    let currentBtn = null;
    let currentEstacion = "";
    let currentSchedule = "";

    // Lista de defectos accesible desde JS (0-9)
    const DEFECTOS = [
        {% for defecto in defectos %}"{{ defecto }}",
        {% endfor %}
    ];

    // Mapa de botones disponible en JS para el teclado
    const buttonInfo = {
        {% for btn_id, (estacion, schedule) in button_map.items() %}
        "{{ btn_id }}": { estacion: "{{ estacion }}", schedule: "{{ schedule }}" },
        {% endfor %}
    };
    const keyToBtn = { '1':'btn1','2':'btn2','3':'btn3','4':'btn4','5':'btn5','6':'btn6','7':'btn7','8':'btn8' };

    // Inyectar indicadores de tecla en cada botón al cargar
    Object.entries(keyToBtn).forEach(([key, btnId]) => {
        const btn = document.getElementById(btnId);
        if (btn) {
            const hint = document.createElement('div');
            hint.className = 'key-hint';
            hint.textContent = key;
            btn.appendChild(hint);
        }
    });

    // Almacén local: { btnId: { defecto, estacion, schedule } }
    // Si el valor es null significa que el operador lo revisó y no encontró defecto (OK)
    const pendingDefects = {};

    // Datos pendientes para confirmar (se llenan al abrir el modal de confirmación)
    let pendingPayload = null;

    function openDefectMenu(btnId, estacion, schedule) {
        currentBtn = btnId;
        currentEstacion = estacion;
        currentSchedule = schedule;

        const existing = pendingDefects[btnId];
        if (existing) {
            document.getElementById('modalTitle').textContent = 'Cambiar Defecto';
            document.getElementById('modalSubtitle').textContent =
                estacion + ' — ' + schedule + '  ·  Actual: ' + existing.defecto;
        } else {
            document.getElementById('modalTitle').textContent = 'Seleccionar Defecto';
            document.getElementById('modalSubtitle').textContent = estacion + ' — ' + schedule;
        }

        document.getElementById('defectModal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('defectModal').classList.remove('active');
        currentBtn = null;
    }

    function showToast(msg, isError) {
        const toast = document.getElementById('toastMsg');
        toast.textContent = msg;
        toast.className = 'toast-msg show' + (isError ? ' error' : '');
        setTimeout(() => { toast.className = 'toast-msg'; }, 2600);
    }

    function updateButtonVisual(btnId) {
        const btn = document.getElementById(btnId);
        const entry = pendingDefects[btnId];

        // Limpiar clases y badges
        btn.classList.remove('has-defect', 'inspected-ok');
        const existingBadge = btn.querySelector('.defect-badge, .ok-badge');
        if (existingBadge) existingBadge.remove();

        if (entry === null) {
            // Marcado como OK
            btn.classList.add('inspected-ok');
            const badge = document.createElement('div');
            badge.className = 'ok-badge';
            badge.textContent = 'OK';
            btn.appendChild(badge);
        } else if (entry) {
            // Tiene defecto
            btn.classList.add('has-defect');
            const badge = document.createElement('div');
            badge.className = 'defect-badge';
            badge.textContent = entry.defecto;
            btn.appendChild(badge);
        }
    }

    function selectDefect(defecto) {
        if (!currentBtn) return;
        pendingDefects[currentBtn] = {
            defecto: defecto,
            estacion: currentEstacion,
            schedule: currentSchedule
        };
        updateButtonVisual(currentBtn);
        showToast(currentEstacion + '/' + currentSchedule + ' → ' + defecto, false);
        closeModal();
    }

    function markAsOk() {
        if (!currentBtn) return;
        pendingDefects[currentBtn] = null; // null = revisado sin defecto
        updateButtonVisual(currentBtn);
        showToast(currentEstacion + '/' + currentSchedule + ' marcada como OK', false);
        closeModal();
    }

    function clearStation() {
        if (!currentBtn) return;
        delete pendingDefects[currentBtn];
        updateButtonVisual(currentBtn);
        showToast(currentEstacion + '/' + currentSchedule + ' restablecida', false);
        closeModal();
    }

    // ── Modal de confirmación ─────────────────────────────────────────────────
    function finalizar() {
        // Solo los que tienen defecto (null = OK, no se guarda en BD)
        const defectosAGuardar = Object.entries(pendingDefects)
            .filter(([, v]) => v !== null)
            .map(([boton, v]) => ({ boton, defecto: v.defecto }));

        const totalConDefecto = defectosAGuardar.length;
        const totalOk = Object.values(pendingDefects).filter(v => v === null).length;
        const totalSinRevisar = 8 - Object.keys(pendingDefects).length;

        // Guardar payload para usarlo al confirmar
        pendingPayload = defectosAGuardar;

        // Construir resumen visual en el modal
        const summary = document.getElementById('confirmSummary');
        let html = '';
        if (totalConDefecto > 0) {
            html += '<div style="margin-bottom:8px;font-weight:700;">Defectos a registrar:</div>';
            defectosAGuardar.forEach(d => {
                const entry = pendingDefects[d.boton];
                html += `<div class="item-defect">&#9679; ${entry.estacion}/${entry.schedule}: ${d.defecto}</div>`;
            });
        }
        if (totalConDefecto > 0 && (totalOk > 0 || totalSinRevisar > 0)) html += '<hr style="border-color:#E6E4DD;margin:10px 0;">';
        if (totalOk > 0)
            html += `<div class="item-ok">&#10004; ${totalOk} soldadora(s) inspeccionada(s) sin defecto</div>`;
        if (totalSinRevisar > 0)
            html += `<div class="item-warn" style="margin-top:4px;">&#9888; ${totalSinRevisar} soldadora(s) sin revisar &mdash; se asumen correctas</div>`;
        if (totalConDefecto === 0 && totalOk === 0)
            html += '<div class="item-warn">No se revisó ninguna soldadora.</div>';

        summary.innerHTML = html;
        document.getElementById('confirmModal').classList.add('active');
    }

    function closeConfirmModal() {
        document.getElementById('confirmModal').classList.remove('active');
        pendingPayload = null;
    }

    function confirmarFinalizar() {
        if (!pendingPayload) return;

        if (pendingPayload.length === 0) {
            // Sin defectos, volver directo
            window.location.href = '/';
            return;
        }

        fetch('/finalizar_inspeccion', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pallet_id: palletId, defectos: pendingPayload })
        })
        .then(r => r.json())
        .then(data => {
            if (data.status === 'ok') {
                window.location.href = '/';
            } else {
                closeConfirmModal();
                showToast(data.message, true);
            }
        })
        .catch(() => { closeConfirmModal(); showToast('Error de conexión', true); });
    }

    // ── Cerrar modales al hacer click fuera ───────────────────────────────────
    document.getElementById('defectModal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });
    document.getElementById('confirmModal').addEventListener('click', function(e) {
        if (e.target === this) closeConfirmModal();
    });

    // ── Control por teclado ───────────────────────────────────────────────────
    document.addEventListener('keydown', function(e) {
        const defectOpen  = document.getElementById('defectModal').classList.contains('active');
        const confirmOpen = document.getElementById('confirmModal').classList.contains('active');

        // ── Dentro del modal de confirmación ──
        if (confirmOpen) {
            if (e.key === 'Enter')  { e.preventDefault(); confirmarFinalizar(); }
            if (e.key === 'Escape') { closeConfirmModal(); }
            return;
        }

        // ── Dentro del modal de defectos ──
        if (defectOpen) {
            if (e.key === 'Escape') { closeModal(); return; }
            if (e.key === 'l' || e.key === 'L') { clearStation(); return; }
            const idx = parseInt(e.key);
            if (!isNaN(idx) && idx >= 0 && idx <= 9 && DEFECTOS[idx] !== undefined) {
                selectDefect(DEFECTOS[idx]);
            }
            return; // bloquear el resto de atajos
        }

        // ── Pantalla de inspección normal ──
        if (keyToBtn[e.key]) {
            const btnId = keyToBtn[e.key];
            const info  = buttonInfo[btnId];
            if (info) openDefectMenu(btnId, info.estacion, info.schedule);
            return;
        }
        if (e.key === 'Enter')  { e.preventDefault(); finalizar(); return; }
        if (e.key === 'Escape') { window.location.href = '/'; return; }
        if (e.key === 'h' || e.key === 'H') { window.location.href = '/historial'; }
    });
</script>

</body>
</html>
