<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspección - Pallet {{ pallet_id }}</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            overflow: hidden;
            background: #F4F3F0;
            color: #2D2D2D;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Top bar */
        .top-bar {
            height: 7vh;
            background: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 2px solid #E6E4DD;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .top-bar .pallet-info {
            font-size: 1.2rem;
            font-weight: bold;
            color: #2D2D2D;
        }
        .top-bar .pallet-info span {
            color: #EA8300;
        }
        .top-bar .actions a {
            color: #767676;
            text-decoration: none;
            margin-left: 15px;
            font-size: 0.95rem;
        }
        .top-bar .actions a:hover { color: #2D2D2D; }

        /* Workspace para la imagen y botones */
        .workspace {
            height: 93vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #F4F3F0;
            position: relative;
        }

        /* Contenedor que abraza la imagen para posicionamiento absoluto */
        .image-wrapper {
            position: relative;
            max-width: 100%;
            max-height: 100%;
            display: inline-block;
        }

        .image-wrapper img {
            max-height: 85vh;
            max-width: 100%;
            display: block;
            border-radius: 12px;
            border: 2px solid #E6E4DD;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        /* Estilo general de los botones sobre la imagen */
        .station-btn {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid #E6E4DD;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.92);
            padding: 6px 14px;
            min-width: 70px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
            z-index: 10;
        }

        .station-btn:hover {
            background: rgba(255, 255, 255, 1);
            border-color: #EA8300;
            transform: translate(-50%, -50%) scale(1.05);
            box-shadow: 0 4px 14px rgba(234,131,0,0.2);
        }
        .station-btn.has-defect {
            border-color: #EA8300;
            background: rgba(255, 248, 235, 0.97);
        }
        .station-btn.inspected-ok {
            border-color: #2A9D8F;
            background: rgba(235, 248, 246, 0.97);
        }

        .station-btn .station-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: #2D2D2D;
            letter-spacing: 1px;
        }

        /* Badges de estado */
        .station-btn .defect-badge, .station-btn .ok-badge {
            position: absolute;
            top: -12px;
            right: -12px;
            color: #fff;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .station-btn .defect-badge { background: #EA8300; }
        .station-btn .ok-badge { background: #2A9D8F; }

        /* Coordenadas específicas de cada soldadura (en %) basadas en la imagen */
        /* Pieza 1 (Izquierda) */
        #btn1 { top: 33%; left: 10%; }
        #btn2 { top: 72%; left: 10%; }
        
        /* Pieza 2 (Centro-Izquierda) */
        #btn3 { top: 22%; left: 36%; }
        #btn4 { top: 76%; left: 34%; }
        
        /* Pieza 3 (Centro-Derecha) */
        #btn5 { top: 27%; left: 56%; }
        #btn6 { top: 76%; left: 58%; }
        
        /* Pieza 4 (Derecha - tiene forma de L invertida) */
        #btn7 { top: 29%; left: 73%; }
        #btn8 { top: 75%; left: 95%; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(45,45,45,0.5);
            backdrop-filter: blur(3px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }

        .modal-box {
            background: #FFFFFF;
            border: 1px solid #E6E4DD;
            border-radius: 16px;
            padding: 30px 40px;
            max-width: 550px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
        }
        .modal-box h2 {
            text-align: center;
            margin-bottom: 5px;
            font-size: 1.5rem;
            color: #2D2D2D;
            font-weight: 700;
        }
        .modal-box .modal-subtitle {
            text-align: center;
            color: #767676;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .defect-list { list-style: none; padding: 0; }
        .defect-list li { margin-bottom: 8px; }
        .defect-list li button {
            width: 100%;
            padding: 13px 20px;
            border: 1.5px solid #E6E4DD;
            border-radius: 10px;
            background: #F4F3F0;
            color: #2D2D2D;
            font-size: 1.05rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.15s;
            font-weight: 500;
        }
        .defect-list li button:hover {
            background: #EA8300;
            border-color: #EA8300;
            color: #fff;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .modal-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-ok { background: #2A9D8F; color: #fff; }
        .btn-ok:hover { background: #21867a; }
        .btn-clear { background: #E6E4DD; color: #767676; }
        .btn-clear:hover { background: #d5d3cc; color: #2D2D2D; }
        .btn-cancel { background: #E6E4DD; color: #767676; }
        .btn-cancel:hover { background: #d5d3cc; color: #2D2D2D; }

        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2A9D8F;
            color: #fff;
            padding: 12px 30px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            z-index: 2000;
            display: none;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .toast-msg.error { background: #EA8300; }
        .toast-msg.show {
            display: block;
            animation: fadeInOut 2.5s ease forwards;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            75% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(20px); }
        }

        .finish-btn-container {
            position: fixed;
            bottom: 12px;
            right: 20px;
            z-index: 500;
        }
        .finish-btn-container button {
            background: #EA8300;
            color: #fff;
            padding: 10px 25px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 2px 8px rgba(234,131,0,0.25);
        }
        .finish-btn-container button:hover { background: #C97000; }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="pallet-info">
        Inspeccionando: Pallet <span>{{ pallet_id }}</span>
    </div>
    <div class="actions">
        <a href="/">&#8592; Cambiar Pallet</a>
        <a href="/historial">Historial</a>
    </div>
</div>

<div class="workspace">
    <div class="image-wrapper">
        <img src="{{ url_for('static', filename='soldaduras.jpg') }}" alt="Plano de Soldaduras">
        
        {% for btn_id, (estacion, schedule) in button_map.items() %}
        <div class="station-btn" id="{{ btn_id }}" onclick="openDefectMenu('{{ btn_id }}', '{{ estacion }}', '{{ schedule }}')">
            <div class="station-name">{{ estacion }}</div>
            </div>
        {% endfor %}
    </div>
</div>

<div class="modal-overlay" id="defectModal">
    <div class="modal-box">
        <h2 id="modalTitle">Seleccionar Defecto</h2>
        <div class="modal-subtitle" id="modalSubtitle">Estación - Schedule</div>
        <ul class="defect-list">
            {% for defecto in defectos %}
            <li>
                <button onclick="selectDefect('{{ defecto }}')">{{ defecto }}</button>
            </li>
            {% endfor %}
        </ul>
        <div class="modal-actions">
            <button class="btn-ok" onclick="markAsOk()">&#10004; Sin Defecto (OK)</button>
            <button class="btn-clear" onclick="clearStation()">&#8635; Limpiar</button>
            <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
        </div>
    </div>
</div>

<div class="toast-msg" id="toastMsg"></div>

<div class="finish-btn-container">
    <button onclick="finalizar()">FINALIZAR INSPECCIÓN</button>
</div>

<script>
    const palletId = "{{ pallet_id }}";
    let currentBtn = null;
    let currentEstacion = "";
    let currentSchedule = "";

    // Almacén local: { btnId: { defecto, estacion, schedule } }
    // Si el valor es null significa que el operador lo revisó y no encontró defecto (OK)
    const pendingDefects = {};

    function openDefectMenu(btnId, estacion, schedule) {
        currentBtn = btnId;
        currentEstacion = estacion;
        currentSchedule = schedule;

        const existing = pendingDefects[btnId];
        if (existing) {
            document.getElementById('modalTitle').textContent = 'Cambiar Defecto';
            document.getElementById('modalSubtitle').textContent =
                estacion + ' — ' + schedule + '  ·  Actual: ' + existing.defecto;
        } else {
            document.getElementById('modalTitle').textContent = 'Seleccionar Defecto';
            document.getElementById('modalSubtitle').textContent = estacion + ' — ' + schedule;
        }

        document.getElementById('defectModal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('defectModal').classList.remove('active');
        currentBtn = null;
    }

    function showToast(msg, isError) {
        const toast = document.getElementById('toastMsg');
        toast.textContent = msg;
        toast.className = 'toast-msg show' + (isError ? ' error' : '');
        setTimeout(() => { toast.className = 'toast-msg'; }, 2600);
    }

    function updateButtonVisual(btnId) {
        const btn = document.getElementById(btnId);
        const entry = pendingDefects[btnId];

        // Limpiar clases y badges
        btn.classList.remove('has-defect', 'inspected-ok');
        const existingBadge = btn.querySelector('.defect-badge, .ok-badge');
        if (existingBadge) existingBadge.remove();

        if (entry === null) {
            // Marcado como OK
            btn.classList.add('inspected-ok');
            const badge = document.createElement('div');
            badge.className = 'ok-badge';
            badge.textContent = 'OK';
            btn.appendChild(badge);
        } else if (entry) {
            // Tiene defecto
            btn.classList.add('has-defect');
            const badge = document.createElement('div');
            badge.className = 'defect-badge';
            badge.textContent = entry.defecto;
            btn.appendChild(badge);
        }
    }

    function selectDefect(defecto) {
        if (!currentBtn) return;
        pendingDefects[currentBtn] = {
            defecto: defecto,
            estacion: currentEstacion,
            schedule: currentSchedule
        };
        updateButtonVisual(currentBtn);
        showToast(currentEstacion + '/' + currentSchedule + ' → ' + defecto, false);
        closeModal();
    }

    function markAsOk() {
        if (!currentBtn) return;
        pendingDefects[currentBtn] = null; // null = revisado sin defecto
        updateButtonVisual(currentBtn);
        showToast(currentEstacion + '/' + currentSchedule + ' marcada como OK', false);
        closeModal();
    }

    function clearStation() {
        if (!currentBtn) return;
        delete pendingDefects[currentBtn];
        updateButtonVisual(currentBtn);
        showToast(currentEstacion + '/' + currentSchedule + ' restablecida', false);
        closeModal();
    }

    // ── Finalizar inspección ──────────────────────────────────────────────────
    function finalizar() {
        // Solo enviar los que tienen defecto (los null = OK no se guardan en BD)
        const defectosAGuardar = Object.entries(pendingDefects)
            .filter(([, v]) => v !== null)
            .map(([boton, v]) => ({ boton, defecto: v.defecto }));

        // Construir resumen para confirmación
        const totalConDefecto = defectosAGuardar.length;
        const totalOk = Object.values(pendingDefects).filter(v => v === null).length;
        const totalSinRevisar = 8 - Object.keys(pendingDefects).length;

        let resumen = '';
        if (totalConDefecto > 0) {
            resumen += defectosAGuardar.map(d => {
                const entry = pendingDefects[d.boton];
                return `• ${entry.estacion}/${entry.schedule}: ${d.defecto}`;
            }).join('\n');
            resumen += '\n';
        }
        if (totalOk > 0) resumen += `\n✔ ${totalOk} soldadora(s) sin defecto`;
        if (totalSinRevisar > 0) resumen += `\n⚠ ${totalSinRevisar} soldadora(s) sin revisar (se asumen OK)`;

        const confirmMsg = totalConDefecto === 0
            ? `No hay defectos registrados.\n${resumen}\n\n¿Finalizar inspección?`
            : `Defectos a guardar:\n${resumen}\n\n¿Confirmar y guardar?`;

        if (!confirm(confirmMsg)) return;

        if (defectosAGuardar.length === 0) {
            // Nada que guardar, volver al inicio directo
            window.location.href = '/';
            return;
        }

        fetch('/finalizar_inspeccion', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pallet_id: palletId, defectos: defectosAGuardar })
        })
        .then(r => r.json())
        .then(data => {
            if (data.status === 'ok') {
                window.location.href = '/';
            } else {
                showToast(data.message, true);
            }
        })
        .catch(() => showToast('Error de conexión', true));
    }

    document.getElementById('defectModal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeModal();
    });
</script>

</body>
</html>
